dataset_name: lung_with_batch_L4
adata_path: data/lung/lung_benchmark_ready.h5ad
output_dir: results

celltype_col: cell_type
donor_col: donor_id
# Sensitivity analysis: include source dataset as a covariate in the classifier.
batch_col: batch
group_col: null
rename_obs: {}

representations:
  hvg: hvg
  pca: X_pca
  harmony: X_harmony
  scvi: X_scVI

# Eligibility is frozen during preprocessing; do not refilter here.
min_cells: null
min_donors: null

run_random_split: true
run_donor_cv: true
run_group_transfer: false
run_donor_ablation: false

test_size: 0.2
n_folds: 5
random_state: 42
random_split_n_repeats: 5
random_split_seeds: null

group_transfer_pairs: []
donor_ablation_k_values: []
donor_ablation_n_repeats: 5

save_filtered_adata: false
verbose: true
