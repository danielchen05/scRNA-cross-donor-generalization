dataset_name: blood_atlas
input_path: data/blood_atlas/blood_atlas_subsampled.h5ad
output_path: data/blood_atlas/blood_atlas_benchmark_ready.h5ad
qc_output_dir: results/preprocessing/blood_atlas
celltype_col: cell_type
donor_col: donor_id
filters: []
metadata_from_obs: {}
support:
  min_cells: 200
  min_donors: 5
  stage: before_downsampling
downsample:
  enabled: false
  group_cols:
  - donor_id
  - cell_type
  max_cells_per_group: 100
  random_state: 0
  rng: default_rng
  sample_full_groups: false
gene_filter:
  exclude_var_if_true: []
  min_cells: null
counts:
  source: X
  target_sum: 10000
  require_integer_like: false
  prepare_from_counts: false
hvg:
  n_top_genes: 1000
  batch_key: donor_id
pca:
  n_comps_compute: 50
  n_comps_keep: 15
  random_state: 42
harmony:
  enabled: true
  batch_key: donor_id
  basis: X_pca
  key_added: X_harmony
  n_comps: 15
  kwargs: {}
scvi:
  enabled: false
  batch_key: donor_id
  layer: counts
  key_added: X_scVI
  n_latent: 15
  max_epochs: null
  early_stopping: true
  random_state: 42
  model_kwargs: {}
  train_kwargs: {}
expected:
  n_cells: 108682
  n_donors: 166
  n_celltypes: 7
  n_hvg: 1000
representations:
  hvg: hvg
  pca: X_pca
  harmony: X_harmony
